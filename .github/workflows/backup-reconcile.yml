name: Database backup and content reconciliation

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17），避开整点调度高峰
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_CONTENT_REPO: ${{ secrets.GITHUB_CONTENT_REPO }}
      GITHUB_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create logical database backup
        run: npm run db:backup -- --out backups --keep 14 --label scheduled

      - name: Upload database backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error

      - name: Reconcile database and content repository
        continue-on-error: true
        run: npm run reconcile:content -- --out reports/content-reconciliation.md

      - name: Upload reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: content-reconciliation-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
