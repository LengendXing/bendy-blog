name: CI

on:
  push:
    branches:
      - main
      - "req/**"
      - "fix/**"
      - "feat/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bendy_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-placeholder
      GITHUB_ID: ci-placeholder
      GITHUB_SECRET: ci-placeholder
      GITHUB_CONTENT_REPO: ci-placeholder/content
      GITHUB_TOKEN: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API smoke tests
        run: npm test

      - name: Production build
        run: npm run build
